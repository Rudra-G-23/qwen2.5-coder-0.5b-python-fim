# configs/data/fim_distribution.yaml
# Stage 1 FIM generation: span-type distribution for the "planned" variant,
# and shared sampling limits for both variants. Driven entirely by this file —
# never hardcoded in src/fim/*.

source:
  # Curated 10k-file sample, migrated into the-stack-v3-python-fim-data
  # under sample_filtered_data_10000/data/ (data-stage-2.md §1-2).
  hf_dataset_repo: "Rudra-G-23/the-stack-v3-python-fim-data"
  path_prefix: "sample_filtered_data_10000"

output:
  hf_dataset_repo: "Rudra-G-23/the-stack-v3-python-fim-data"
  # config-name (parquet filename) per variant — folder-name mapping to
  # experiment/random_data/ and experiment/distributed_data/ lives in
  # scripts/generate_fim_variants.py's FOLDER_NAME, not here.
  configs:
    random: "random"
    planned: "distributed"

wandb:
  # Separate from training's qwen-coder-python-fim project — all data
  # curation + FIM-generation monitoring lands here.
  project: "521er1007-national-institute-of-technology-rourkela/stack-v3-python-fim-data"

sampling:
  total_examples: 20000        # target example count per variant
  max_spans_per_file: 8        # cap so no single large file dominates a variant
  seed: 42

# Hand-set starting distribution (a hypothesis, not a derived value — see
# data-stage-1.md §6-8 and distribution_planned.py's module docstring for
# how the pilot experiment is meant to validate or falsify it). Percentages
# must sum to 100.
planned_distribution:
  line: 20
  expression: 15
  statement: 20
  block: 15
  function-body: 15
  method-body: 10
  class-level: 3
  api-call: 2
