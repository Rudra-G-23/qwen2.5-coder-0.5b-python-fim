# configs/data/stack_v3_filter.yaml
# Stage 1 curation: source, filter thresholds, and checkpoint targets for
# scripts/build_sample.py. All values here — never hardcoded in curation code.

source:
  dataset: "HuggingFaceCode/stack-v3-train"
  split: "train"

target:
  files: 10000              # stop collecting once this many files survive all filters
  chunk_size: 1000           # files per parquet chunk (checkpoint after each chunk)

language:
  keep: "Python"              # files[].language value to keep

license:
  # license_type values that pass this stage unconditionally.
  # Anything else is flagged as ambiguous and excluded from the curated count,
  # but its full license fields are still logged for manual review (never dropped).
  keep_types:
    - "permissive"
    - "no_license"

quality:
  size_bytes:
    # v3 stats' p5/p95 file-size-bytes, per the spec's sane defaults
    min: 135
    max: 13457
  # Heuristics for rejecting binary/minified/generated-looking files
  max_line_length: 1000        # longer than this on any single line → likely minified
  min_avg_line_length_for_minified_check: 300  # only flag "minified" if avg line is long too
  generated_markers:
    - "@generated"
    - "do not edit"
    - "auto-generated"
    - "autogenerated"
    - "code generated by"
    - "this file was generated"

secrets:
  # Simple regex pass — intentionally not overbuilt for this stage.
  # `['"]?` after `=` covers both quoted ("key = 'value'") and unquoted
  # source literals. (In YAML single-quoted strings a literal `'` is
  # written as `''` — that's the doubled quote inside the brackets below.)
  patterns:
    - '(?i)aws_secret_access_key\s*=\s*[''"]?[A-Za-z0-9/+=]{20,}'
    - '(?i)aws_access_key_id\s*=\s*[''"]?AKIA[0-9A-Z]{16}'
    - "-----BEGIN (RSA|EC|DSA|OPENSSH|PGP) PRIVATE KEY-----"
    - "ghp_[A-Za-z0-9]{36}"
    - "sk-[A-Za-z0-9]{20,}"
    - '(?i)(api_key|apikey|secret_key|access_token)\s*=\s*[''"]?[A-Za-z0-9_\-]{16,}'
    - '(?i)password\s*=\s*[''"]?\S{8,}'

checkpoint:
  hf_dataset_repo: "Rudra-G-23/qwen-coder-python-fim-data"
  chunk_filename_template: "chunk_shard{shard_index:04d}_row{row_start}-{row_end}.parquet"
  checkpoint_filename_template: "checkpoint_{chunk_id}.json"
