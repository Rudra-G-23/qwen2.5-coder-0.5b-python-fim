# configs/data/stack_v3_eval_pool_no_fim.yaml
#
# PLAN CHANGE (2026-08-28): this pool no longer curates a fresh 50,000-file
# corpus from row 0. It now *continues* the exact stack-v3-train stream the
# 10k pilot left off at — `sample_filtered_data_10000`'s final checkpoint
# `checkpoint_chunk_0009.json` (shard_index 9, row_offset 13500,
# cumulative_files_collected 10000):
# https://huggingface.co/datasets/Rudra-G-23/the-stack-v3-python-fim-data/blob/main/sample_filtered_data_10000/checkpoints/checkpoint_chunk_0009.json
#
# On this prefix's first-ever session, `continue_from_path_prefix` below both
#   (a) seeds the dedup set from sample_filtered_data_10000's seen_hashes.json, and
#   (b) starts streaming at (shard 9 + 1, row 13500) instead of (0, 0),
# so every file collected here is strictly *after* everything the 10k pilot
# scanned — disjoint from the pilot by stream position AND by content hash,
# not by a downstream filter. No time wasted re-streaming/re-filtering the
# first 13,500 rows.
#
# Same source/filter criteria as configs/data/stack_v3_filter.yaml. Written
# to its own path_prefix (`stack_v3_python_only_data_without_fim`) — a small
# held-out pool the fixed `safim_eval_1000` eval set is drawn from, NOT a
# replacement for sample_filtered_data_10000/. See
# .claude/stages/data_stages/data-stage-2.md §1 for why an explicit finite
# ceiling is used instead of streaming uncapped.

source:
  dataset: "HuggingFaceCode/stack-v3-train"
  split: "train"

target:
  files: 2000                # this pool's own count (starts from 0 here, not
                             # from the pilot's 10k) — enough headroom for
                             # safim_eval_1000.yaml's sampling.source_file_count
                             # (750) plus per-bucket shortfall slack. Bump this
                             # and resume if a later eval set needs a bigger draw.
  chunk_size: 1000           # files per parquet chunk (checkpoint after each chunk)

language:
  keep: "Python"              # files[].language value to keep

license:
  # license_type values that pass this stage unconditionally.
  # Anything else is flagged as ambiguous and excluded from the curated count,
  # but its full license fields are still logged for manual review (never dropped).
  keep_types:
    - "permissive"
    - "no_license"

quality:
  size_bytes:
    # v3 stats' p5/p95 file-size-bytes, per the spec's sane defaults
    min: 135
    max: 13457
  # Heuristics for rejecting binary/minified/generated-looking files
  max_line_length: 1000        # longer than this on any single line → likely minified
  min_avg_line_length_for_minified_check: 300  # only flag "minified" if avg line is long too
  generated_markers:
    - "@generated"
    - "do not edit"
    - "auto-generated"
    - "autogenerated"
    - "code generated by"
    - "this file was generated"

secrets:
  # Simple regex pass — intentionally not overbuilt for this stage.
  # `['"]?` after `=` covers both quoted ("key = 'value'") and unquoted
  # source literals. (In YAML single-quoted strings a literal `'` is
  # written as `''` — that's the doubled quote inside the brackets below.)
  patterns:
    - '(?i)aws_secret_access_key\s*=\s*[''"]?[A-Za-z0-9/+=]{20,}'
    - '(?i)aws_access_key_id\s*=\s*[''"]?AKIA[0-9A-Z]{16}'
    - "-----BEGIN (RSA|EC|DSA|OPENSSH|PGP) PRIVATE KEY-----"
    - "ghp_[A-Za-z0-9]{36}"
    - "sk-[A-Za-z0-9]{20,}"
    - '(?i)(api_key|apikey|secret_key|access_token)\s*=\s*[''"]?[A-Za-z0-9_\-]{16,}'
    - '(?i)password\s*=\s*[''"]?\S{8,}'

checkpoint:
  # New folder, same dataset repo as the 10k pilot sample — a small,
  # disjoint held-out pool for eval-set curation, not a replacement for
  # sample_filtered_data_10000/.
  hf_dataset_repo: "Rudra-G-23/the-stack-v3-python-fim-data"
  path_prefix: "stack_v3_python_only_data_without_fim"
  chunk_filename_template: "chunk_shard{shard_index:04d}_row{row_start}-{row_end}.parquet"
  checkpoint_filename_template: "checkpoint_{chunk_id}.json"
  # On this prefix's very first-ever session (no checkpoint history yet):
  #   1. seed its dedup set from the named prefix's already-complete
  #      seen_hashes.json, and
  #   2. start streaming from that prefix's highest checkpoint position
  #      (shard_index + 1, row_offset) instead of (0, 0).
  # Together these make this pool a strict continuation of the 10k pilot's
  # stream — every file here is newer than row 13500 and hash-disjoint from
  # the pilot. Ignored on every later resume (this prefix's own checkpoint
  # history is authoritative from then on — see scripts/build_sample.py's
  # _resume_state).
  continue_from_path_prefix: "sample_filtered_data_10000"

wandb:
  # Separate from training's qwen-coder-python-fim project — all data
  # curation + FIM-generation monitoring lands here.
  project: "521er1007-national-institute-of-technology-rourkela/stack-v3-python-fim-data"
