# configs/training/pilot.yaml
# Stage 1 pilot comparison: random vs. planned FIM distribution.
# Kept separate from lora.yaml so the shared hyperparameters in lora.yaml stay
# untouched — only what varies per pilot run (seed, dataset variant, output
# subfolder) lives here. scripts/run_pilot_experiment.py deep-merges one
# entry's overrides onto configs/training/lora.yaml per run via
# train_lora.train().

base_config: "configs/training/lora.yaml"

# 2-3 seeds per variant — a 10k-file result is a pilot signal, not conclusive,
# and seed variance must be distinguishable from distribution effect.
seeds:
  - 42
  - 123
  - 7

# One shared HF model repo for both experiment variants (and, later, every
# fine-tune approach tried on whichever dataset variant wins — see
# data-stage-1.md §7 discussion). Variants are separated by subfolder, not
# by repo, so W&B/eval comparisons and browsing on HF both stay under one
# roof instead of being split across repos.
output_hf_repo: "Rudra-G-23/qwen2.5-coder-0.5b-python-fim"

variants:
  random:
    dataset_hf_repo: "Rudra-G-23/the-stack-v3-python-fim-data"
    dataset_folder: "experiment/random_data"
    dataset_config: "random"
    output_subfolder: "experiment/random_model"
  planned:
    dataset_hf_repo: "Rudra-G-23/the-stack-v3-python-fim-data"
    dataset_folder: "experiment/distributed_data"
    dataset_config: "planned"
    output_subfolder: "experiment/distributed_model"

wandb:
  project: "521er1007-national-institute-of-technology-rourkela/qwen-coder-python-fim"
  job_type: "train"
